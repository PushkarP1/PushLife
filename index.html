<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PushLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <div class="title" id="title">PushLife</div>
      <div class="sub" id="subtitle"></div>
    </div>
    <nav class="modes" role="tablist">
      <button data-mode="map" role="tab">Map</button>
      <button data-mode="timeline" role="tab">Timeline</button>
      <button data-mode="locations" role="tab">Locations</button>
    </nav>
    <div class="tools">
      <button id="themeBtn" class="switch" role="switch" aria-checked="true" aria-label="Night sky" title="Day / Night">
        <span class="ico sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></span><span class="ico moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M15.5 3.6a8.6 8.6 0 1 0 4.9 14.6A7.2 7.2 0 0 1 15.5 3.6z"/><path class="fill" d="M19 3.2l.7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z"/></svg></span><span class="knob"></span>
      </button>
      <div class="settings" id="settings">
        <div class="menu" id="settingsMenu" aria-hidden="true">
          <button id="printBtnM" class="iconbtn" style="--i:0" aria-label="Print" title="Print" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8.5" rx="2"/><path d="M7 13.5h10v7H7z"/></svg></button>
          <button id="editBtn" class="iconbtn" style="--i:1" aria-label="Edit data" title="Edit data" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
          <button id="shareBtn" class="iconbtn" style="--i:2" aria-label="Copy share link" title="Copy share link" tabindex="-1"><span class="a"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7L12 6.3"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg></span><span class="b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
        </div>
        <button id="gearBtn" class="iconbtn gear" aria-label="Settings" aria-expanded="false" aria-controls="settingsMenu" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg></button>
      </div>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <main id="stage">
    <div id="mapWrap">
      <svg id="map"></svg>
      <canvas id="trails" aria-hidden="true"></canvas>
      <div class="zoomBtns">
        <button data-z="in" aria-label="Zoom in">+</button>
        <button data-z="out" aria-label="Zoom out">−</button>
        <button data-z="fit" aria-label="Fit world">⤢</button>
      </div>
      <div class="nowLabel" id="nowLabel"></div>
    </div>
    <aside id="detail" hidden></aside>
  </main>

  <footer id="timeWrap">
    <div class="transport">
      <button id="playBtn" class="play" aria-label="Play">▶</button>
      <div class="when"><span id="rdMonth"></span>
        <input id="yearJump" type="text" inputmode="numeric" maxlength="4" autocomplete="off" spellcheck="false" aria-label="Year. Type a year and press Enter to jump there" title="Type a year and press Enter. Arrow keys step through years.">
      </div>
      <div class="readout" id="readout"></div>
    </div>
    <svg id="timeline"></svg>
  </footer>

  <section id="print" hidden>
    <div class="printControls">
      <label>Visual
        <select id="pVisual">
          <option value="map">Journey map</option>
          <option value="timeline">Timeline</option>
          <option value="locations">Locations</option>
        </select>
      </label>
      <label>Paper
        <select id="pSize">
          <option value="a3p">A3 portrait</option>
          <option value="a3l">A3 landscape</option>
          <option value="a4p">A4 portrait</option>
          <option value="p1824">18 × 24 in portrait</option>
          <option value="letterl">Letter landscape</option>
        </select>
      </label>
      <label>Title <input id="pTitle" type="text"></label>
      <button id="printBtn" class="primary">Print / save PDF</button>
    </div>
    <div class="posterStage" id="posterStage"><div class="poster" id="poster"></div></div>
  </section>

  <div id="tip" class="tip" hidden></div>
  <aside id="editor" hidden></aside>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
